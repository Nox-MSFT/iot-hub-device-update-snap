# Template: Steps to build ADU Agent targeting ARM architecture.
# Consume these steps in one or more jobs by passing in parameter values.

parameters:
  - name: targetOs # example: ubuntu2204
    type: string
  - name: targetArch # example: amd64
    type: string
  - name: patchVersion # example: 3
    default: ''
    type: string

steps:
  - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
    displayName: "Component Detection"
    inputs:
      sourceScanPath: src

  - task: Docker@2
    displayName: Pull Debian 10 image
    inputs:
      command: pull
      arguments: "--platform linux/${{ parameters.targetArch }} debian:buster"

  - bash: |
      echo "Running whoami"
      whoami
      echo "Register QEMU"
      sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      echo "Listing running containers"
      sudo docker ps -a
      echo "Listing current images"
      sudo docker images
    displayName: "Prebuild"
    condition: always()

  # NOTE: We removed '-v /tmp:/tmp' so that our container can properly install
  # CMake to /tmp/deviceupdate-cmake inside the container.
  - bash: |
      sudo docker run -d -t --rm \
        --platform linux/${{ parameters.targetArch }} \
        -v $(Build.SourcesDirectory):/iot-hub-device-update \
        -v ~/.gitconfig:/etc/.gitconfig \
        --name ARMcontainer \
        debian:buster \
        bash

      sudo docker exec ARMcontainer bash -c '\
        set -e; \
        cd /iot-hub-device-update; \
        apt-get update; \
        echo "Installing dependencies and CMake..."; \
        ./scripts/install-deps.sh --install-all-deps --install-cmake; \
        echo "Running build script..."; \
        ./scripts/build.sh --clean --build-unit-tests --type MinSizeRel \
          --platform-layer linux --log-lib zlog --build-packages \
          --out-dir out-${{ parameters.targetOs }}-${{ parameters.targetArch }}'
    displayName: "Build Client, Unit Tests and Packages: linux-MinSizeRel"

  - bash: |
      cp out-${{ parameters.targetOs }}-${{ parameters.targetArch }}/*.deb "$(Build.ArtifactStagingDirectory)"
      cp out-${{ parameters.targetOs }}-${{ parameters.targetArch }}/src/agent/out-${{ parameters.targetOs }}-${{ parameters.targetArch }}/bin/AducIotAgent \
         "$(Build.ArtifactStagingDirectory)/AducIotAgent"
    displayName: "Stage build artifacts (Deb package, agent and docs)"
    condition: ne(variables['Build.Reason'], 'PullRequest')

  - bash: |
      sudo docker exec -w "/iot-hub-device-update/out-${{ parameters.targetOs }}-${{ parameters.targetArch }}" ARMcontainer \
        ctest --repeat until-pass:10 --force-new-ctest-process -T test -V --output-on-failure
    displayName: "Run Unit Tests: linux-MinSizeRel"

  - task: PublishTestResults@2
    displayName: "Publish Unit Test Results: linux-MinSizeRel"
    condition: succeededOrFailed() # Run this task even if tests fail.
    inputs:
      testResultsFormat: cTest
      testResultsFiles: "Testing/**/*.xml"
      searchFolder: "out-${{ parameters.targetOs }}-${{ parameters.targetArch }}"
      failTaskOnFailedTests: true
      publishRunAttachments: false # Attachments are not supported for CTest

  - task: 1ES.PublishPipelineArtifact@1
    displayName: "Publish Pipeline Artifacts"
    inputs:
      artifactName: "adu-client-${{ parameters.targetOs }}-${{ parameters.targetArch }}"
      targetPath: "$(Build.ArtifactStagingDirectory)"

  - bash: |
      sudo docker stop ARMcontainer
      sudo rm -rf "out-${{ parameters.targetOs }}-${{ parameters.targetArch }}"
    displayName: "Postbuild"
    condition: always()
